<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Political Science Timeline | Mock Test Portal</title>
    <link rel="icon" type="image/png" href="../assets/Favicon.png">

    <!-- Theme Flash Prevention (must be before CSS) -->
    <script>
        (function(){var t=localStorage.getItem('theme-preference')||'light';
        if(t==='auto')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
        document.documentElement.setAttribute('data-theme',t);})();
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/timeline.css">
    <link rel="stylesheet" href="../css/theme.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&family=Montserrat:wght@700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="timeline-page">
    <div id="app" class="timeline-app">
        <!-- Background Overlay -->
        <div class="page-background"></div>

        <!-- Static Header Section -->
        <div class="fixed-top-section">
            <nav class="back-nav">
                <a href="../index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Portal</span>
                </a>

                <!-- Fullscreen Toggle Button -->
                <div class="fullscreen-nav">
                    <button id="fullscreen-btn" class="fullscreen-btn" title="Toggle Fullscreen">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </nav>

            <header class="timeline-header">
                <h1>Political Science Timeline</h1>
                <p>Explore historical events in chronological order, filtered by book or chapter.</p>
            </header>

            <!-- Unified Control Card -->
            <div class="timeline-controls-card">
                <!-- Timeline View Dropdown -->
                <div class="control-group">
                    <label>TIMELINE VIEW</label>
                    <div class="custom-dropdown" id="view-dropdown">
                        <div class="dropdown-trigger" id="view-trigger">
                            <span id="selected-view-text">All Chapters (Master Order)</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="dropdown-content" id="view-dropdown-content">
                            <div class="options-list" id="view-options-list">
                                <!-- Options injected by JS -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Select Book Dropdown -->
                <div class="control-group">
                    <label>SELECT BOOK</label>
                    <div class="custom-dropdown disabled" id="book-dropdown">
                        <div class="dropdown-trigger" id="book-trigger">
                            <span id="selected-book-text">All Books</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="dropdown-content" id="book-dropdown-content">
                            <div class="options-list" id="book-options-list">
                                <!-- Books injected by JS -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Select Chapter Dropdown -->
                <div class="control-group">
                    <label>SELECT CHAPTER</label>
                    <div class="custom-dropdown disabled" id="chapter-dropdown">
                        <div class="dropdown-trigger" id="chapter-trigger">
                            <span id="selected-chapter-text">All Chapters</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="dropdown-content" id="chapter-dropdown-content">
                            <div class="options-list" id="chapter-options-list">
                                <!-- Chapters injected by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scrollable Timeline Section -->
        <main class="timeline-main-container">
            <div class="timeline-wrapper" id="timeline-wrapper">
                <div class="timeline-content-area">
                    <div class="timeline-track"></div>
                    <div class="timeline-items-container" id="timeline-content">
                        <!-- Events injected by JS -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Fixed Footer -->
        <footer class="timeline-footer">
            &copy; 2026 Political Science Mock Portal. Designed by Kanishk Mani.
        </footer>
    </div>

    <!-- JavaScript Files -->
    <!-- Timeline Data Aggregator and Modules -->
    <script src="../js/timeline-data.js"></script>
    <!-- CWP Book Chapters -->
    <script src="../data/CWP timeline/Ch1 - Bipolarity.js"></script>
    <script src="../data/CWP timeline/Ch2 - Centres of Power.js"></script>
    <script src="../data/CWP timeline/Ch3 - Contemporary South Asia.js"></script>
    <script src="../data/CWP timeline/Ch4 - International Organisations.js"></script>
    <script src="../data/CWP timeline/Ch5 - Security.js"></script>
    <script src="../data/CWP timeline/Ch6 - Environment.js"></script>
    <script src="../data/CWP timeline/Ch7 - Globalisation.js"></script>
    <!-- PISI Book Chapters -->
    <script src="../data/PISI timeline/Ch1 - Nation Building.js"></script>
    <script src="../data/PISI timeline/Ch2 - One Party Dominance.js"></script>
    <script src="../data/PISI timeline/Ch3 - Planned Development.js"></script>
    <script src="../data/PISI timeline/Ch4 - External Relations.js"></script>
    <script src="../data/PISI timeline/Ch5 - Congress System.js"></script>
    <script src="../data/PISI timeline/Ch6 - Democratic Crisis.js"></script>
    <script src="../data/PISI timeline/Ch7 - Regional Aspirations.js"></script>
    <script src="../data/PISI timeline/Ch8 - Recent Developments.js"></script>

    <script src="../js/timeline.js"></script>
    <script src="../js/theme.js"></script>
</body>

</html>
